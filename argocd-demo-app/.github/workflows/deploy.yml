name: CI/CD Harbor + Trivy

on:
  push:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t my-app:latest .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: my-app:latest
          format: table
          exit-code: 1  # 0 = OK, 1 = fail if vulnerabilities found
          ignore-unfixed: false

      - name: Log in to Harbor
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
          registry: my-harbor-domain.com

      - name: Push Docker image to Harbor
        run: |
          docker tag my-app:latest my-harbor-domain.com/library/my-app:latest
          docker push my-harbor-domain.com/library/my-app:latest
