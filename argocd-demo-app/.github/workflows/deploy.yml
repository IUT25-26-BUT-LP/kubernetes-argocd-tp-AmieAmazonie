name: CI/CD Harbor + Trivy

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Permet de lancer manuellement

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t my-app:latest .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: my-app:latest
          format: table
          exit-code: 1
          ignore-unfixed: false

      - name: Log in to Harbor
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
          registry: harbor.example.com   # Remplace par ton URL Harbor

      - name: Tag Docker image for Harbor
        run: |
          docker tag my-app:latest harbor.example.com/project/my-app:latest

      - name: Push Docker image to Harbor
        run: |
          docker push harbor.example.com/project/my-app:latest
